server:
  port: "443"

tls:
  enabled: true
  cert_file: "/etc/letsencrypt/live/ecs.letshare.fun/fullchain.pem"
  key_file: "/etc/letsencrypt/live/ecs.letshare.fun/privkey.pem"
  auto_cert: true
  domain: "ecs.letshare.fun"

jwt:
  secret: "letshare-jwt-secret-key-2024-production"
  expiration_hours: 720 # 30天

cors:
  allowed_origins:
    - "http://localhost:3000"     # 本地开发前端
    - "http://localhost:5173" 
    - "https://letshare.fun"
    - "http://letshare.fun"
    - "https://www.letshare.fun"
    - "https://cdn.letshare.fun"
    - "https://ecs.letshare.fun"
    - "https://md.bigonion.cn"

log:
  level: "info"
  max_entries: 200

websocket:
  max_room_users: 50

file_transfer:
  enabled: true
  max_file_size: 3221225472  # 3GB PRO 统一上限
  chunk_size: 65536          # 64KB per chunk
  pro_invite_code: "bigonion"

runtime:
  gomaxprocs: 0  # 0 = use all available CPU cores

# TURN 嵌入式中继（pion/turn，随主进程启动）。
# secret 绝不进 git：部署时用环境变量 LETSHARE_TURN_SECRET 注入
# （viper AutomaticEnv：LETSHARE_TURN_SECRET → turn.secret）。
# 安全组须放行：3478/udp + 3478/tcp（listener），49160-49200/udp（中继端口段）。
turn:
  enabled: true
  public_ip: "101.133.108.16"     # ecs.letshare.fun 公网 IP（RelayAddress 下发用）
  port: 3478
  relay_port_min: 49160
  relay_port_max: 49200
  realm: "letshare.fun"
  uris:
    - "turn:ecs.letshare.fun:3478?transport=udp"
    - "turn:ecs.letshare.fun:3478?transport=tcp"
  ttl_seconds: 600
