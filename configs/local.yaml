server:
  port: "8080"

tls:
  enabled: false
  cert_file: ""
  key_file: ""
  auto_cert: false
  domain: ""

jwt:
  secret: "letshare-jwt-secret-key-2024-local"
  expiration_hours: 168 # 7天

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"
    - "http://192.168.1.106:5173"
    - "http://192.168.1.13:5173"

log:
  level: "debug"  # 本地测试使用debug级别
  max_entries: 500

websocket:
  max_room_users: 10

file_transfer:
  enabled: true
  max_file_size: 3221225472  # 3GB PRO 统一上限
  chunk_size: 65536          # 64KB
  pro_invite_code: "bigonion"

runtime:
  gomaxprocs: 0  # 使用所有CPU核心

turn:
  enabled: true
  secret: "local-dev-turn-secret"  # 本地/E2E 用占位 secret；生产走 LETSHARE_TURN_SECRET 环境变量
  public_ip: "127.0.0.1"
  port: 3478
  relay_port_min: 49160
  relay_port_max: 49200
  realm: "letshare.fun"
  uris:
    - "turn:127.0.0.1:3478?transport=udp"
    - "turn:127.0.0.1:3478?transport=tcp"
  ttl_seconds: 600

